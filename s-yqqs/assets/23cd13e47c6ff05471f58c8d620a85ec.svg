<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="557.06605" height="1781.3988" viewBox="0,0,557.06605,1781.3988"><g transform="translate(73.31306,-1.23444)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill="#d6d6d6" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" font-size="40" text-anchor="start" style="mix-blend-mode: normal"><text transform="translate(3.003,22.68444) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#d6d6d6" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">日志</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">2.14</tspan><tspan x="0" dy="46.150000000000006px">发布</tspan><tspan x="0" dy="46.150000000000006px">增加了选人功能</tspan><tspan x="0" dy="46.150000000000006px">“抢修”了开始界面bug</tspan><tspan x="0" dy="46.150000000000006px">使开始封面可以在准备和即将开始两种状态间不断切换</tspan><tspan x="0" dy="46.150000000000006px">删除“等待几秒”代码，提高性能</tspan><tspan x="0" dy="46.150000000000006px">将开始游戏的“重复执行直到”改为“等待”</tspan><tspan x="0" dy="46.150000000000006px">2.13</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">修改能量刷新代码</tspan><tspan x="0" dy="46.150000000000006px">更改武器消耗能量代码</tspan><tspan x="0" dy="46.150000000000006px">调校怪物子弹大小</tspan><tspan x="0" dy="46.150000000000006px">加入了骑士技能</tspan><tspan x="0" dy="46.150000000000006px">加入了破旧的手枪开火动画</tspan><tspan x="0" dy="46.150000000000006px">加入了牧师的攻击动画</tspan><tspan x="0" dy="46.150000000000006px">加入了敌人远距离攻击</tspan><tspan x="0" dy="46.150000000000006px">加入刷怪提醒</tspan><tspan x="0" dy="46.150000000000006px">加入了瞄准圈</tspan><tspan x="0" dy="46.150000000000006px">刷怪完成后传送门消失</tspan><tspan x="0" dy="46.150000000000006px">消灭所有怪物后胜利</tspan><tspan x="0" dy="46.150000000000006px">导入了法师皮肤</tspan><tspan x="0" dy="46.150000000000006px">能量塔</tspan><tspan x="0" dy="46.150000000000006px">2.12</tspan><tspan x="0" dy="46.150000000000006px">加入手枪后座力</tspan><tspan x="0" dy="46.150000000000006px">解决了摇杆BUG</tspan><tspan x="0" dy="46.150000000000006px">加入了封面和开始按钮以及封面BGM</tspan><tspan x="0" dy="46.150000000000006px">加入了宝石和能量塔（差逻辑）</tspan><tspan x="0" dy="46.150000000000006px">加入了关卡怪物设定</tspan><tspan x="0" dy="46.150000000000006px">加入了伤害值显示</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">2.11</tspan><tspan x="0" dy="46.150000000000006px">加入了地图</tspan><tspan x="0" dy="46.150000000000006px">加入了魔法弹</tspan><tspan x="0" dy="46.150000000000006px">加入了血刃两段攻击</tspan><tspan x="0" dy="46.150000000000006px">2.10</tspan><tspan x="0" dy="46.150000000000006px">完成了主角瞄准</tspan><tspan x="0" dy="46.150000000000006px">NPC数据导入完成</tspan><tspan x="0" dy="46.150000000000006px">地图进度：100%</tspan><tspan x="0" dy="46.150000000000006px">加入魔法弹</tspan><tspan x="0" dy="46.150000000000006px">加入了牧师攻击</tspan><tspan x="0" dy="46.150000000000006px">加入了血刃攻击</tspan><tspan x="0" dy="46.150000000000006px">解决了克隆体BUG</tspan><tspan x="0" dy="46.150000000000006px">2.9</tspan><tspan x="0" dy="46.150000000000006px">增加了NPC和传送门、宝石</tspan><tspan x="0" dy="46.150000000000006px">加入了伤害判定</tspan><tspan x="0" dy="46.150000000000006px">2.8</tspan><tspan x="0" dy="46.150000000000006px">完成了血刃的动画效果</tspan><tspan x="0" dy="46.150000000000006px">增加小明小红的飞出逻辑（有BUG）</tspan><tspan x="0" dy="46.150000000000006px">2.7</tspan><tspan x="0" dy="46.150000000000006px">导入了角色造型动画</tspan><tspan x="0" dy="46.150000000000006px">导入了小明小红</tspan><tspan x="0" dy="46.150000000000006px">2.6</tspan><tspan x="0" dy="46.150000000000006px">完成了数字引擎和状态栏刷新</tspan><tspan x="0" dy="46.150000000000006px">实现了扣护盾、扣血、护盾恢复的逻辑</tspan><tspan x="0" dy="46.150000000000006px">修复了攻击键的BUG</tspan><tspan x="0" dy="46.150000000000006px">导入了角色、技能、武器的数据</tspan><tspan x="0" dy="46.150000000000006px">完成了护盾、能量、技能图标的动画</tspan><tspan x="0" dy="46.150000000000006px">2.5</tspan><tspan x="0" dy="46.150000000000006px">加入了虚拟按键</tspan><tspan x="0" dy="46.150000000000006px">技能冷却计算</tspan><tspan x="0" dy="46.150000000000006px">加入了状态栏血量、护盾、能量</tspan><tspan x="0" dy="46.150000000000006px">初步加入了数字</tspan><tspan x="0" dy="46.150000000000006px">2.4</tspan><tspan x="0" dy="46.150000000000006px">确定职业分工</tspan><tspan x="0" dy="46.150000000000006px">加了屏幕滚动</tspan><tspan x="0" dy="46.150000000000006px">实现了子弹的飞行，进行了位置的调校</tspan><tspan x="0" dy="46.150000000000006px">添加了虚拟摇杆</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">2.3  </tspan><tspan x="0" dy="46.150000000000006px">确定了要做的几个职业</tspan><tspan x="0" dy="46.150000000000006px">建立了初版引擎（方向键控制朝向、武器自瞄）</tspan><tspan x="0" dy="46.150000000000006px">2.2 </tspan><tspan x="0" dy="46.150000000000006px">项目组成立，冉朗任队长</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">游戏模式：地牢生存++++</tspan></text><text transform="translate(-73.06306,239.00901) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#d6d6d6" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0"> </tspan></text></g></g></svg>