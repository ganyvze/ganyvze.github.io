<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="197.07221" height="284.83295" viewBox="0,0,197.07221,284.83295"><defs><linearGradient x1="240.00007" y1="115.40966" x2="240.00007" y2="303.09033" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#000000" stop-opacity="0.65882"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></linearGradient></defs><g transform="translate(-141.46391,-115.40966)"><g stroke-miterlimit="10"><path d="M141.46391,303.09033v-187.68067h197.07221v187.68068z" fill="url(#color-1)" stroke="none" stroke-width="0" stroke-linecap="butt"/><text transform="translate(145.53326,175.06779) scale(0.38212,0.38212)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0"> 瘟疫之首是位将毒与邪术探</tspan><tspan x="0" dy="48px">究到极致的巫毒术士。她是</tspan><tspan x="0" dy="48px">瘟疫的源头其所到之处、毒</tspan><tspan x="0" dy="48px">气四散、疾病蔓延、怪物横</tspan><tspan x="0" dy="48px">行。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px"> 直面和她战斗也不容易，她</tspan><tspan x="0" dy="48px">的大镰刀是令众战士害怕三</tspan><tspan x="0" dy="48px">分的利器。这便是她能够坐</tspan><tspan x="0" dy="48px">稳一灾祸之首的原因。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px"> 所以，你打算用何种方式消</tspan><tspan x="0" dy="48px">毒？</tspan></text><path d="M145.42362,156.61213h187.5" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round"/><text transform="translate(149.41671,141.76252) scale(0.51748,0.51748)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="#ffffff" stroke-width="0.2" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">最终头目-瘟疫之首</tspan></text></g></g></svg>