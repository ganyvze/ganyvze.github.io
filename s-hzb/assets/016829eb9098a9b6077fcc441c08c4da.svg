<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="197.07221" height="194.33777" viewBox="0,0,197.07221,194.33777"><defs><linearGradient x1="240.00005" y1="115.40966" x2="240.00005" y2="303.09033" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#000000" stop-opacity="0.65882"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></linearGradient></defs><g transform="translate(-141.46389,-115.40966)"><g stroke-miterlimit="10"><path d="M141.46389,303.09033v-187.68067h197.07221v187.68068z" fill="url(#color-1)" stroke="none" stroke-width="0" stroke-linecap="butt"/><text transform="translate(148.91669,143.84723) scale(0.63542,0.63542)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="#ffffff" stroke-width="0.2" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">精英-巨人</tspan></text><text transform="translate(148.4236,175.18118) scale(0.38527,0.38527)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">精英怪也是比杂兵威胁性高</tspan><tspan x="0" dy="48px">的敌人，但比Boss差。</tspan><tspan x="0" dy="48px">他们一般来说不会拥有单独</tspan><tspan x="0" dy="48px">的血条。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">巨人就是巨大的人，</tspan><tspan x="0" dy="48px">但是这个巨人不会震荡波，</tspan><tspan x="0" dy="48px">只会打拳。</tspan></text><path d="M145.4236,156.61213h187.5" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round"/></g></g></svg>