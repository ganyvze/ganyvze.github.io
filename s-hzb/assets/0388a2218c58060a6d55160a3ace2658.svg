<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="197.07221" height="193.01801" viewBox="0,0,197.07221,193.01801"><defs><linearGradient x1="320.0001" y1="115.40966" x2="320.0001" y2="303.09033" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#000000" stop-opacity="0.65882"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></linearGradient></defs><g transform="translate(-221.46394,-115.40966)"><g stroke-miterlimit="10"><path d="M221.46394,303.09033v-187.68067h197.07221v187.68068z" fill="url(#color-1)" stroke="none" stroke-width="0" stroke-linecap="butt"/><path d="M412.92365,156.61213h-187.5" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round"/><text transform="translate(228.91675,143.84723) scale(0.63542,0.63542)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="#ffffff" stroke-width="0.2" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">精英-装甲车</tspan></text><text transform="translate(225.53328,175.06779) scale(0.38212,0.38212)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0"> 装甲车是经过武装的载具。</tspan><tspan x="0" dy="48px">其本身坚硬而又不失速度。</tspan><tspan x="0" dy="48px">上方装有火炮以打击敌人，</tspan><tspan x="0" dy="48px">而车辆本身又可以撞击、碾</tspan><tspan x="0" dy="48px">压敌人。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px"> 总体来说，这是个比普通巨</tspan><tspan x="0" dy="48px">人好用的战争机器。</tspan></text></g></g></svg>