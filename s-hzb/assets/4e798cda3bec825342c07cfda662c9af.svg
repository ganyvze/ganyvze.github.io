<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="207.16612" height="229.80767" viewBox="0,0,207.16612,229.80767"><defs><linearGradient x1="320.00009" y1="115.40966" x2="320.00009" y2="303.09033" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#000000" stop-opacity="0.65882"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></linearGradient></defs><g transform="translate(-221.46392,-115.40966)"><g stroke-miterlimit="10"><path d="M221.46393,303.09033v-187.68067h197.07221v187.68068z" fill="url(#color-1)" stroke="none" stroke-width="0" stroke-linecap="butt"/><path d="M412.92364,156.61213h-187.5" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round"/><text transform="translate(228.91674,143.84723) scale(0.63542,0.63542)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="#ffffff" stroke-width="0.2" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">小头目-飞锯炮塔</tspan></text><text transform="translate(225.53327,175.06779) scale(0.38212,0.38212)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0"> 飞锯炮塔是个实验性的兵器。</tspan><tspan x="0" dy="48px">它是个飞碟状的载具，上面</tspan><tspan x="0" dy="48px">装机关枪，飞盘是个巨大的</tspan><tspan x="0" dy="48px">圆锯。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px"> 但由于飞锯炮塔的操作难度</tspan><tspan x="0" dy="48px">极高，几乎没人能够驾驭这</tspan><tspan x="0" dy="48px">个飞盘。同时毕竟是实验性</tspan><tspan x="0" dy="48px">的武器，它没有大量投入生</tspan><tspan x="0" dy="48px">产。</tspan></text></g></g></svg>