<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="197.07221" height="231.32369" viewBox="0,0,197.07221,231.32369"><defs><linearGradient x1="240.00005" y1="115.40966" x2="240.00005" y2="303.09033" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#000000" stop-opacity="0.65882"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></linearGradient></defs><g transform="translate(-141.46389,-115.40966)"><g stroke-miterlimit="10"><path d="M141.46389,303.09033v-187.68067h197.07221v187.68068z" fill="url(#color-1)" stroke="none" stroke-width="0" stroke-linecap="butt"/><text transform="translate(148.4236,175.18118) scale(0.38527,0.38527)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">星术师是特别研究星空的魔</tspan><tspan x="0" dy="48px">法师，属于极少数人。他们</tspan><tspan x="0" dy="48px">的智慧与实力远凌驾于其它</tspan><tspan x="0" dy="48px">魔法师之上</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">星术师擅长用星空化为自己</tspan><tspan x="0" dy="48px">的力量。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">听说他们魔法的本质是信仰</tspan><tspan x="0" dy="48px">位居星空的神祗或上位者.</tspan></text><path d="M145.4236,156.61213h187.5" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round"/><text transform="translate(148.91671,143.84723) scale(0.63542,0.63542)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="#ffffff" stroke-width="0.2" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">小头目-星术师</tspan></text></g></g></svg>