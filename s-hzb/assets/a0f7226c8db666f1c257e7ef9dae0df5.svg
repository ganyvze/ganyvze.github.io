<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="207.87802" height="194.33777" viewBox="0,0,207.87802,194.33777"><defs><linearGradient x1="240.00007" y1="115.40966" x2="240.00007" y2="303.09033" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#000000" stop-opacity="0.65882"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></linearGradient></defs><g transform="translate(-141.46391,-115.40966)"><g stroke-miterlimit="10"><path d="M141.46391,303.09033v-187.68067h197.07221v187.68068z" fill="url(#color-1)" stroke="none" stroke-width="0" stroke-linecap="butt"/><text transform="translate(148.91671,143.84723) scale(0.63542,0.63542)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="#ffffff" stroke-width="0.2" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">小头目-长枪骑士</tspan></text><text transform="translate(148.42362,175.18118) scale(0.38527,0.38527)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">小头目是在关卡最后会出现</tspan><tspan x="0" dy="48px">的Boss，一般来说他们独占</tspan><tspan x="0" dy="48px">一波攻势。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">长枪骑士，顾名思义就是拿</tspan><tspan x="0" dy="48px">着阔头枪的骑士。不像杂兵，</tspan><tspan x="0" dy="48px">他可以形成真气，从远处攻</tspan><tspan x="0" dy="48px">击你。</tspan></text><path d="M145.42362,156.61213h187.5" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round"/></g></g></svg>