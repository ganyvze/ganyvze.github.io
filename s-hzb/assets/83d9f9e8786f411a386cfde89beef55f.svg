<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="207.87802" height="194.33777" viewBox="0,0,207.87802,194.33777"><defs><linearGradient x1="240.00007" y1="115.40966" x2="240.00007" y2="303.09033" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#000000" stop-opacity="0.65882"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></linearGradient></defs><g transform="translate(-141.46391,-115.40966)"><g stroke-miterlimit="10"><path d="M141.46391,303.09033v-187.68067h197.07221v187.68068z" fill="url(#color-1)" stroke="none" stroke-width="0" stroke-linecap="butt"/><text transform="translate(148.42362,175.18118) scale(0.38527,0.38527)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">毒是巫师最先发展的道路，</tspan><tspan x="0" dy="48px">它涉及到用各种奇怪的气体</tspan><tspan x="0" dy="48px">或者液体洒向敌人，让敌人</tspan><tspan x="0" dy="48px">摄入他们，从而让他们中毒</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">不过相比于灼烧或者出血，</tspan><tspan x="0" dy="48px">毒的效用缓慢，且难以发展，</tspan><tspan x="0" dy="48px">所以毒不多见</tspan></text><path d="M145.42362,156.61213h187.5" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round"/><text transform="translate(148.91672,143.84723) scale(0.63542,0.63542)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="#ffffff" stroke-width="0.2" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">主题-毒</tspan></text></g></g></svg>