<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="197.07221" height="268.30961" viewBox="0,0,197.07221,268.30961"><defs><linearGradient x1="240.00007" y1="115.40966" x2="240.00007" y2="303.09033" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#000000" stop-opacity="0.65882"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></linearGradient></defs><g transform="translate(-141.46391,-115.40966)"><g stroke-miterlimit="10"><path d="M141.46391,303.09033v-187.68067h197.07221v187.68068z" fill="url(#color-1)" stroke="none" stroke-width="0" stroke-linecap="butt"/><text transform="translate(148.42362,175.18118) scale(0.38527,0.38527)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">铁匠和附魔师齐心打造了一</tspan><tspan x="0" dy="48px">把巨剑，这把剑融合了可怕</tspan><tspan x="0" dy="48px">的魔力，号称“神挡杀神”</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">有名被选中的剑士拿上了这</tspan><tspan x="0" dy="48px">把武器，也是个普通人，</tspan><tspan x="0" dy="48px">而你要做的就是杀了这个剑</tspan><tspan x="0" dy="48px">士，打破“神挡杀神”的神</tspan><tspan x="0" dy="48px">话。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">毕竟真能和神掰手腕的存在</tspan><tspan x="0" dy="48px">还不会出现在这。</tspan></text><path d="M145.42362,156.61213h187.5" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round"/><text transform="translate(149.41671,141.76252) scale(0.51748,0.51748)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="#ffffff" stroke-width="0.2" stroke-linecap="butt" font-family="&quot;STSong&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">最终头目-弑神巨剑</tspan></text></g></g></svg>