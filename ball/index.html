<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>无限轨道</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; overflow: hidden; user-select: none; }
    canvas { display: block; }

    /* 液态玻璃 (Liquid Glassmorphism) 通用样式 */
    .glass-panel {
      background: rgba(20, 10, 40, 0.85);
      backdrop-filter: blur(12px) saturate(120%);
      -webkit-backdrop-filter: blur(12px) saturate(120%);
      border: 1px solid rgba(255, 104, 253, 0.3);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* 左上角圆形液态玻璃设置按钮 */
    #settingsBtn {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      z-index: 60;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      color: #fff;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37),
                  inset 0 0 15px rgba(255, 255, 255, 0.15),
                  0 0 15px rgba(21, 190, 252, 0.2);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s, border-color 0.3s;
      outline: none;
    }
    #settingsBtn:hover {
      transform: scale(1.12) rotate(45deg);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 12px 40px rgba(21, 190, 252, 0.4),
                  inset 0 0 20px rgba(255, 255, 255, 0.3);
    }
    #settingsBtn:active {
      transform: scale(0.95);
    }

    /* GameOver 弹窗 */
    #gameOverOverlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      justify-content: center; align-items: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: overlayIn 0.3s ease-out;
    }
    @keyframes overlayIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    #gameOverBox {
      text-align: center;
      padding: 50px 60px;
      background: linear-gradient(135deg, rgba(20, 10, 40, 0.95), rgba(10, 5, 25, 0.98));
      border: 1px solid rgba(255, 104, 253, 0.3);
      border-radius: 20px;
      box-shadow: 0 0 60px rgba(255, 104, 253, 0.15), 0 0 120px rgba(21, 190, 252, 0.08);
      animation: boxIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes boxIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    #gameOverBox h1 {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 52px;
      font-weight: 800;
      color: #ff4060;
      text-shadow: 0 0 20px rgba(255, 64, 96, 0.5), 0 0 40px rgba(255, 64, 96, 0.2);
      margin-bottom: 12px;
      letter-spacing: 4px;
    }
    #gameOverBox p {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 36px;
    }
    #restartBtn {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #ff68fd, #15befc);
      border: none;
      padding: 14px 48px;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(255, 104, 253, 0.3);
      letter-spacing: 2px;
    }
    #restartBtn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 30px rgba(255, 104, 253, 0.5);
    }
    #restartBtn:active {
      transform: scale(0.97);
    }

    /* 分数与速度显示 */
    #scorePanel {
      position: fixed;
      top: 24px;
      right: 32px;
      z-index: 50;
      text-align: right;
      font-family: 'Segoe UI', Arial, sans-serif;
      pointer-events: none;
      user-select: none;
    }
    #scoreValue {
      font-size: 44px;
      font-weight: 800;
      color: #4488ff;
      text-shadow: 0 0 16px currentColor, 0 0 32px currentColor;
      letter-spacing: 1px;
      transition: color 0.25s ease, text-shadow 0.25s ease;
      line-height: 1;
    }
    #scoreValue.bump {
      animation: scoreBump 0.28s ease-out;
    }
    @keyframes scoreBump {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    #bestScore {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 1px;
    }
    #bestScore span {
      color: rgba(255, 255, 255, 0.85);
    }
    #speedDisplay {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #15befc;
      text-shadow: 0 0 8px rgba(21, 190, 252, 0.5);
      letter-spacing: 1px;
    }

    /* PERFECT 动态提示样式 */
    .perfect-popup {
      position: fixed;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 46px;
      font-weight: 900;
      font-style: italic;
      background: linear-gradient(135deg, #ffe528, #ff68fd, #15befc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(255, 229, 40, 0.7));
      pointer-events: none;
      z-index: 80;
      opacity: 0;
      animation: perfectPop 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes perfectPop {
      0% { opacity: 0; transform: translate(-50%, -20%) scale(0.5) rotate(-6deg); }
      30% { opacity: 1; transform: translate(-50%, -50%) scale(1.25) rotate(2deg); }
      65% { opacity: 1; transform: translate(-50%, -60%) scale(1.0) rotate(0deg); }
      100% { opacity: 0; transform: translate(-50%, -90%) scale(0.8) rotate(6deg); }
    }

    /* 暂停弹窗 */
    #pauseOverlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 90;
      justify-content: center; align-items: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
      animation: overlayIn 0.25s ease-out;
    }
    #pauseBox {
      text-align: center;
      pointer-events: none;
    }
    #pauseBox h1 {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 48px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 20px rgba(21, 190, 252, 0.5), 0 0 40px rgba(255, 104, 253, 0.25);
      margin-bottom: 12px;
      letter-spacing: 8px;
    }
    #pauseBox p {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 15px;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 2px;
    }

    /* 设置模态框样式 */
    .modal-overlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: 120;
      justify-content: center; align-items: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: overlayIn 0.25s ease-out;
    }
    .modal-box {
      width: 520px;
      max-width: 90vw;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      animation: boxIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 优化设置模态框的滚动条样式 */
    .modal-box::-webkit-scrollbar {
      width: 6px;
    }
    .modal-box::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
    }
    .modal-box::-webkit-scrollbar-thumb {
      background: rgba(21, 190, 252, 0.4);
      border-radius: 8px;
      border: 1px solid rgba(255, 104, 253, 0.3);
    }
    .modal-box::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 104, 253, 0.7);
    }
    .modal-box {
      scrollbar-width: thin;
      scrollbar-color: rgba(21, 190, 252, 0.4) rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }
    .modal-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: #15befc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .close-btn:hover {
      background: rgba(255, 64, 96, 0.8);
      border-color: #ff4060;
    }

    .tut-section {
      border-left: 4px solid #15befc;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      margin-bottom: 16px;
      padding: 16px;
    }
    .tut-section h3 {
      color: #ff68fd;
      font-size: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .setting-row {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 10px 14px;
      font-size: 14px;
    }
    .key-bind-btn {
      border: 1px solid #15befc;
      color: #15befc;
      cursor: pointer;
      text-transform: uppercase;
      background: #111;
      border-radius: 4px;
      min-width: 80px;
      padding: 6px 12px;
      font-weight: 700;
      text-align: center;
      transition: all 0.2s;
    }
    .key-bind-btn:hover {
      background: #15befc;
      color: #000;
    }
    .key-bind-btn.listening {
      background: #ff68fd;
      color: #fff;
      border-color: #ff68fd;
      animation: pulseKey 1s infinite;
    }
    @keyframes pulseKey {
      0% { box-shadow: 0 0 2px #ff68fd; }
      50% { box-shadow: 0 0 12px #ff68fd; }
      100% { box-shadow: 0 0 2px #ff68fd; }
    }

    .danger-zone {
      border: 1px solid rgba(255, 64, 96, 0.5);
      border-radius: 8px;
      margin-top: 15px;
      padding: 15px;
      background: rgba(255, 0, 0, 0.05);
    }
    .control-btn-sub {
      color: #fff;
      cursor: pointer;
      background: rgba(20, 10, 30, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .control-btn-sub:hover {
      border-color: #15befc;
      background: rgba(21, 190, 252, 0.2);
    }
  </style>
</head>
<body>

  <!-- 左上角圆形液态玻璃设置按钮 -->
  <button id="settingsBtn" title="游戏设置" onclick="openSettings()">⚙</button>

  <!-- 分数与实时速度显示 -->
  <div id="scorePanel">
    <div id="scoreValue">0</div>
    <div id="bestScore">最高分 <span id="bestScoreValue">0</span></div>
    <div id="speedDisplay">速度 1.00x</div>
  </div>

  <!-- 暂停弹窗 -->
  <div id="pauseOverlay">
    <div id="pauseBox">
      <h1>已暂停</h1>
      <p>点击屏幕 或 按 <span id="pauseKeyTip">Space</span> 继续</p>
    </div>
  </div>

  <!-- GameOver 弹窗 -->
  <div id="gameOverOverlay">
    <div id="gameOverBox">
      <h1>GAME OVER</h1>
      <p id="gameOverMsg">颜色不同，球碎了...</p>
      <button id="restartBtn">再来一次</button>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="settingsModalOverlay" class="modal-overlay" onclick="onSettingsOverlayClick(event)">
    <div class="glass-panel modal-box">
      <div class="modal-header">
        <h2>⚙ 游戏设置</h2>
        <button class="close-btn" onclick="closeSettings()">关闭</button>
      </div>

      <!-- 快捷键绑定卡片 -->
      <div class="tut-section">
        <h3>⌨️ 自定义快捷键</h3>
        <div class="setting-row">
          <span>暂停 / 继续</span>
          <button id="bindPauseBtn" class="key-bind-btn" onclick="listenPauseKey()">SPACE</button>
        </div>
      </div>

      <!-- 游戏偏好设置卡片 -->
      <div class="tut-section">
        <h3>🎮 运行参数</h3>
        <div class="setting-row">
          <span>用户基础倍速</span>
          <select id="speedSelect" style="background:#111; color:#15befc; border:1px solid #15befc; padding:4px 8px; border-radius:4px; font-weight:bold;" onchange="changeGameSpeed(this.value)">
            <option value="1">1.0x (标准)</option>
            <option value="1.25">1.25x (快速)</option>
            <option value="1.5">1.5x (极速)</option>
          </select>
        </div>
        <div class="setting-row">
          <span>长按右键临时加速</span>
          <span style="color:#ffe528; font-weight:bold;">1.25x ⚡</span>
        </div>
        <div class="setting-row">
          <span>粒子与渲染特效</span>
          <label style="display:flex; align-items:center; cursor:pointer;">
            <input type="checkbox" id="effectsToggle" checked onchange="toggleEffects(this.checked)" style="width:18px; height:18px; accent-color:#ff68fd;">
          </label>
        </div>
      </div>

      <!-- 数据管理卡片 -->
      <div class="tut-section">
        <h3>💾 数据管理</h3>
        <div style="display:flex; gap:10px; margin-bottom:12px;">
          <button class="control-btn-sub" style="flex:1; border-color:#15befc; color:#15befc;" onclick="exportSave()">📥 导出战绩</button>
          <button class="control-btn-sub" style="flex:1; border-color:#ffe528; color:#ffe528;" onclick="document.getElementById('importFileInput').click()">📤 导入战绩</button>
          <input type="file" id="importFileInput" accept=".html" style="display:none;" onchange="handleImport(event)">
        </div>

        <div class="danger-zone">
          <h4 style="color:#ff4060; margin-bottom:8px; font-size:14px;">⚠️ 危险区域</h4>
          <button class="control-btn-sub" style="width:100%; background:rgba(255,64,96,0.2); border-color:#ff4060; color:#ff4060;" onclick="showClearConfirm()">🗑️ 清除最高分数据</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 清除数据确认弹窗 -->
  <div id="clearConfirmOverlay" class="modal-overlay" style="z-index: 130;" onclick="onClearOverlayClick(event)">
    <div class="glass-panel modal-box" style="width: 400px; border-color: #ff4060;">
      <h2 style="color: #ff4060; margin-bottom: 12px; font-size: 20px;">⚠️ 确认清除最高分</h2>
      <p style="color: #ccc; font-size: 14px; margin-bottom: 12px;">请输入当前最高分（<span id="clearHintBest" style="color:#ff4060; font-weight:bold;">0</span>）确认：</p>
      <input type="number" id="clearConfirmInput" placeholder="请输入最高分" style="width: 100%; padding: 8px; background: #111; border: 1px solid #ff4060; color: #fff; border-radius: 4px; margin-bottom: 16px; text-align: center; outline: none;">
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="control-btn-sub" onclick="closeClearConfirm()">取消</button>
        <button class="control-btn-sub" style="background: #ff4060; border-color: #ff4060; color: #fff;" onclick="confirmClearData()">确认删除</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 10);
    camera.lookAt(0, 0, -10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableRotate  = false;
    controls.enableZoom    = false;
    controls.enablePan     = false;
    controls.target.set(0, 0, -10);

    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(4000 * 3);
    for (let i = 0; i < starPos.length; i++) starPos[i] = (Math.random() - 0.5) * 300;
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo,
      new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.7 })));

    scene.add(new THREE.AmbientLight(0x223355, 1.8));

    const keyLight = new THREE.PointLight(0xffffff, 150, 50);
    keyLight.position.set(5, 8, 5);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const fillLight = new THREE.PointLight(0x6633ff, 70, 30);
    fillLight.position.set(-5, -2, 3);
    scene.add(fillLight);

    const movingLight = new THREE.PointLight(0xff6600, 60, 25);
    scene.add(movingLight);

    const lightBall = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xff9933 })
    );
    scene.add(lightBall);

    const GROUND_Y      = -2.0;
    const BALL_RADIUS   = 0.5;
    const GRAVITY_Y     = -9.8;   // Y 方向真实重力加速度（m/s²）
    const INIT_HEIGHT   = 3.0;    // 弹跳高度（相对地面，固定不衰减）
    const VISIBLE_DEPTH = 120;    // 球前方可见距离

    // 弹跳物理：h = INIT_HEIGHT，g = |GRAVITY_Y|
    const _g = Math.abs(GRAVITY_Y);
    const _t_down = Math.sqrt(2 * INIT_HEIGHT / _g);
    const BOUNCE_PERIOD = 2 * _t_down;

    // 轨道组间距
    const GAP_MIN = 2.5;
    const GAP_MAX = 5.0;

    // ===== 颜色定义 =====
    const COLORS = {
      pink:  { hex: 0xff68fd, rgb: [255, 104, 253] },
      yellow:{ hex: 0xffe528, rgb: [255, 229,  40] },
      blue:  { hex: 0x15befc, rgb: [ 21, 190, 252] }
    };
    const COLOR_KEYS = ['pink', 'yellow', 'blue'];
    function randColor() { return COLOR_KEYS[Math.floor(Math.random() * 3)]; }

    // ===== 轨道组尺寸 =====
    const PLATE_HEIGHT = 0.12;

    // 类型1：长直轨道（一块长板）
    const LONG_SIZE_X = 3.5;
    const LONG_SIZE_Z = 0.8;
    // 类型2/3：方形轨道（小方块）
    const SQ_SIZE     = 0.7;   // 方块边长
    const SQ_SPACING  = 0.9;   // 方块中心间距

    // ===== 移动轨道系统（中后期动态挑战） =====
    const MOVING_TRACK_SCORE_THRESHOLD = 30; // 达到该分数后才可能出现左右移动的方形轨道
    const MOVING_TRACK_CHANCE = 0.35;         // 满足分数条件后，方形轨道组出现移动的概率
    const MOVING_TRACK_SPEED_MIN = 0.9;       // 左右移动速度下限（单位/秒）
    const MOVING_TRACK_SPEED_MAX = 1.8;       // 左右移动速度上限（单位/秒）
    const MOVING_TRACK_RANGE_MIN = 0.4;       // 左右移动幅度（相对初始位置的偏移半径）下限
    const MOVING_TRACK_RANGE_MAX = 0.7;       // 左右移动幅度上限
    const MOVING_TRACK_BOUND_X = LONG_SIZE_X / 2 - SQ_SIZE / 2 - 0.15; // X 轴可移动的安全边界（避免超出长轨道范围）

    // ===== 几何体（共享） =====
    const longGeo = new THREE.BoxGeometry(LONG_SIZE_X, PLATE_HEIGHT, LONG_SIZE_Z);
    const sqGeo   = new THREE.BoxGeometry(SQ_SIZE, PLATE_HEIGHT, SQ_SIZE);

    // 生成白色箭头纹理（Canvas 动态绘制）
    function createArrowTextureForColor(colorKey) {
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = COLORS[colorKey].hex;
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(size * 0.5, size * 0.15);
      ctx.lineTo(size * 0.72, size * 0.45);
      ctx.lineTo(size * 0.58, size * 0.45);
      ctx.lineTo(size * 0.58, size * 0.82);
      ctx.lineTo(size * 0.42, size * 0.82);
      ctx.lineTo(size * 0.42, size * 0.45);
      ctx.lineTo(size * 0.28, size * 0.45);
      ctx.closePath();
      ctx.fill();
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }
    const arrowTextures = {};
    for (const ck of Object.keys(COLORS)) {
      arrowTextures[ck] = createArrowTextureForColor(ck);
    }

    function makeMat(colorKey) {
      const rgb = COLORS[colorKey].rgb;
      return new THREE.MeshStandardMaterial({
        color: COLORS[colorKey].hex,
        metalness: 0.3, roughness: 0.35,
        emissive: new THREE.Color(rgb[0]*0.5/255, rgb[1]*0.5/255, rgb[2]*0.5/255),
        transparent: true, opacity: 1.0
      });
    }

    function makeSqMats(colorKey) {
      const topMat = makeMat(colorKey);
      topMat.map = arrowTextures[colorKey];
      topMat.color.set(0xffffff);
      const side1 = makeMat(colorKey);
      const side2 = makeMat(colorKey);
      const side3 = makeMat(colorKey);
      const side4 = makeMat(colorKey);
      const bottom = makeMat(colorKey);
      return [side1, side2, topMat, bottom, side3, side4];
    }

    // ===== 轨道组系统 =====
    const trackGroups = [];
    const groupZList  = [];
    let groupIdCounter = 0;
    let score = 0; // 提前声明，供移动轨道生成逻辑（生成时机早于分数面板初始化）读取

    function createType1(z, colorKey) {
      const mat = makeMat(colorKey);
      const mesh = new THREE.Mesh(longGeo, mat);
      mesh.position.set(0, GROUND_Y + PLATE_HEIGHT / 2, z);
      mesh.receiveShadow = true;
      mesh.castShadow = true;
      scene.add(mesh);
      return { type: 1, meshes: [mesh], mats: [mat], z, colorKey, id: groupIdCounter++ };
    }

    // 是否允许在当前分数下生成移动轨道
    function shouldSpawnMovingTrack() {
      return score >= MOVING_TRACK_SCORE_THRESHOLD && Math.random() < MOVING_TRACK_CHANCE;
    }

    // 为组内每个方块附加左右移动状态（baseX 为摆动中心，即原始生成位置）
    function attachMovingState(result, xPositions) {
      const moving = shouldSpawnMovingTrack();
      result.moving = moving;
      result.moveBaseX = xPositions.slice();
      if (moving) {
        result.moveSpeed = MOVING_TRACK_SPEED_MIN + Math.random() * (MOVING_TRACK_SPEED_MAX - MOVING_TRACK_SPEED_MIN);
        result.moveRange = MOVING_TRACK_RANGE_MIN + Math.random() * (MOVING_TRACK_RANGE_MAX - MOVING_TRACK_RANGE_MIN);
        result.movePhase = Math.random() * Math.PI * 2;
        // 方向随机取反，避免所有移动轨道同步摆动
        if (Math.random() < 0.5) result.moveSpeed *= -1;
      }
      return result;
    }

    function createType2(z, colors) {
      const result = { type: 2, meshes: [], mats: [], z, colorKeys: [], id: groupIdCounter++ };
      const xPositions = [-SQ_SPACING, 0, SQ_SPACING];
      for (let i = 0; i < 3; i++) {
        const mats = makeSqMats(colors[i]);
        const mesh = new THREE.Mesh(sqGeo, mats);
        mesh.position.set(xPositions[i], GROUND_Y + PLATE_HEIGHT / 2, z);
        mesh.receiveShadow = true;
        mesh.castShadow = true;
        scene.add(mesh);
        result.meshes.push(mesh);
        result.mats.push(...mats);
        result.colorKeys.push(colors[i]);
      }
      return attachMovingState(result, xPositions);
    }

    function createType3(z, colors) {
      const result = { type: 3, meshes: [], mats: [], z, colorKeys: [], id: groupIdCounter++ };
      const offset = SQ_SPACING * 0.65;
      const xPositions = [-offset, offset];
      for (let i = 0; i < 2; i++) {
        const mats = makeSqMats(colors[i]);
        const mesh = new THREE.Mesh(sqGeo, mats);
        mesh.position.set(xPositions[i], GROUND_Y + PLATE_HEIGHT / 2, z);
        mesh.receiveShadow = true;
        mesh.castShadow = true;
        scene.add(mesh);
        result.meshes.push(mesh);
        result.mats.push(...mats);
        result.colorKeys.push(colors[i]);
      }
      return attachMovingState(result, xPositions);
    }

    function createRandomGroup(z, safeColor) {
      const type = Math.floor(Math.random() * 3) + 1;
      let group;
      if (type === 1) {
        group = createType1(z, randColor());
      } else if (type === 2) {
        const cols = [...COLOR_KEYS].sort(() => Math.random() - 0.5);
        group = createType2(z, cols);
      } else {
        const otherKeys = COLOR_KEYS.filter(k => k !== safeColor);
        const other = otherKeys[Math.floor(Math.random() * otherKeys.length)];
        const cols = [safeColor, other].sort(() => Math.random() - 0.5);
        group = createType3(z, cols);
      }
      trackGroups.push(group);
      groupZList.push(z);
      return group;
    }

    function disposeGroup(group) {
      for (const m of group.meshes) scene.remove(m);
      for (const mat of group.mats) mat.dispose();
    }

    function removeGroup(idx) {
      disposeGroup(trackGroups[idx]);
      trackGroups.splice(idx, 1);
      groupZList.splice(idx, 1);
    }

    function randGap() {
      return GAP_MIN + Math.random() * (GAP_MAX - GAP_MIN);
    }

    let lastLongTrackColor = null;

    function generateInitialGroups() {
      let z = 0;
      for (let i = 0; i < 5; i++) {
        const g = createType1(z, randColor());
        trackGroups.push(g);
        groupZList.push(z);
        z -= randGap();
      }
      lastLongTrackColor = trackGroups[trackGroups.length - 1].colorKey;
      while (z > -VISIBLE_DEPTH) {
        z -= randGap();
        createRandomGroup(z, lastLongTrackColor);
        const newGroup = trackGroups[trackGroups.length - 1];
        if (newGroup.type === 1) {
          lastLongTrackColor = newGroup.colorKey;
        }
      }
    }
    generateInitialGroups();

    const FADE_START = 3;
    const FADE_END   = 12;

    function updateTrack(deltaZ, dt) {
      for (let i = 0; i < trackGroups.length; i++) {
        groupZList[i] += deltaZ;
        trackGroups[i].z = groupZList[i];
        for (const m of trackGroups[i].meshes) {
          m.position.z = groupZList[i];
        }
      }

      // 更新左右移动轨道的 X 位置（正弦摆动，速度决定摆动快慢及方向）
      if (dt) {
        for (const group of trackGroups) {
          if (!group.moving) continue;
          group.movePhase += group.moveSpeed * dt;
          for (let mi = 0; mi < group.meshes.length; mi++) {
            const baseX = group.moveBaseX[mi];
            const offset = Math.sin(group.movePhase) * group.moveRange;
            let x = baseX + offset;
            x = Math.max(-MOVING_TRACK_BOUND_X, Math.min(MOVING_TRACK_BOUND_X, x));
            group.meshes[mi].position.x = x;
          }
        }
      }

      for (let i = trackGroups.length - 1; i >= 0; i--) {
        const z = groupZList[i];
        if (z > FADE_START) {
          const ratio = Math.min(1, (z - FADE_START) / (FADE_END - FADE_START));
          for (const mat of trackGroups[i].mats) {
            mat.opacity = 1.0 - ratio;
          }
        }
        if (z > FADE_END) {
          removeGroup(i);
        }
      }

      let minZ = groupZList.length > 0 ? Math.min(...groupZList) : 0;
      while (minZ > -VISIBLE_DEPTH) {
        minZ -= randGap();
        createRandomGroup(minZ, lastLongTrackColor);
        const newGroup = trackGroups[trackGroups.length - 1];
        if (newGroup.type === 1) {
          lastLongTrackColor = newGroup.colorKey;
        }
      }
    }

    const sphereGeo = new THREE.SphereGeometry(BALL_RADIUS, 64, 64);
    const sphereMat = new THREE.MeshStandardMaterial({
      color: 0x4488ff, metalness: 0.3, roughness: 0.2, emissive: 0x112244
    });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    sphere.castShadow = true;
    scene.add(sphere);

    const wireMesh = new THREE.Mesh(sphereGeo,
      new THREE.MeshBasicMaterial({ color: 0x88ccff, wireframe: true, transparent: true, opacity: 0.08 })
    );
    scene.add(wireMesh);

    const ringCount = 120;
    const ringPos   = new Float32Array(ringCount * 3);
    for (let i = 0; i < ringCount; i++) {
      const a = (i / ringCount) * Math.PI * 2;
      const r = 0.8 + Math.random() * 0.1;
      ringPos[i * 3]     = Math.cos(a) * r;
      ringPos[i * 3 + 1] = (Math.random() - 0.5) * 0.1;
      ringPos[i * 3 + 2] = Math.sin(a) * r;
    }
    const ringGeo = new THREE.BufferGeometry();
    ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
    const ring = new THREE.Points(ringGeo,
      new THREE.PointsMaterial({ color: 0x66aaff, size: 0.04, transparent: true, opacity: 0.7 }));
    scene.add(ring);

    // 球状态
    const floorContact = GROUND_Y + BALL_RADIUS;
    let ballX       = 0;
    let ballY       = floorContact;
    let velY        = Math.sqrt(2 * _g * INIT_HEIGHT);
    let velZ        = 0;
    let falling     = false;

    // 连击 (Combo) 机制变量
    let comboCount = 0;

    const raycaster = new THREE.Raycaster();
    const mouseNDC  = new THREE.Vector2(0, 0);
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const raycastTarget = new THREE.Vector3();
    let targetBallX = 0;
    let hasMouseInput = false;

    function updateTargetBallXFromEvent(clientX, clientY) {
      mouseNDC.x = (clientX / window.innerWidth) * 2 - 1;
      mouseNDC.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouseNDC, camera);
      if (raycaster.ray.intersectPlane(groundPlane, raycastTarget)) {
        targetBallX = raycastTarget.x;
        hasMouseInput = true;
      }
    }

    document.addEventListener('mousemove', (e) => {
      updateTargetBallXFromEvent(e.clientX, e.clientY);
    });
    document.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches.length > 0) {
        updateTargetBallXFromEvent(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    // ===== 长按右键临时加速系统 =====
    let isRightClickPressed = false;

    // 禁用默认右键菜单
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('mousedown', (e) => {
      if (e.button === 2) {
        isRightClickPressed = true;
        updateSpeedDisplayUI();
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 2) {
        isRightClickPressed = false;
        updateSpeedDisplayUI();
      }
    });

    window.addEventListener('mouseleave', () => {
      if (isRightClickPressed) {
        isRightClickPressed = false;
        updateSpeedDisplayUI();
      }
    });

    window.addEventListener('blur', () => {
      if (isRightClickPressed) {
        isRightClickPressed = false;
        updateSpeedDisplayUI();
      }
    });

    function findCollisionWithAnyGroup() {
      const r = BALL_RADIUS;
      let bestGroup = null, bestColorKey = null, bestMesh = null;
      let bestDist = Infinity;
      for (let gi = 0; gi < trackGroups.length; gi++) {
        const group = trackGroups[gi];
        const gz = groupZList[gi];
        for (let mi = 0; mi < group.meshes.length; mi++) {
          const mesh = group.meshes[mi];
          const bx = mesh.position.x;
          const by = mesh.position.y;
          let hsx, hsz;
          if (group.type === 1) {
            hsx = LONG_SIZE_X / 2;
            hsz = LONG_SIZE_Z / 2;
          } else {
            hsx = SQ_SIZE / 2;
            hsz = SQ_SIZE / 2;
          }
          const hsy = PLATE_HEIGHT / 2;
          const closestX = Math.max(bx - hsx, Math.min(ballX, bx + hsx));
          const closestY = Math.max(by - hsy, Math.min(ballY, by + hsy));
          const closestZ = Math.max(gz - hsz, Math.min(0, gz + hsz));
          const dx = ballX - closestX;
          const dy = ballY - closestY;
          const dz = 0 - closestZ;
          const dist = dx * dx + dy * dy + dz * dz;
          if (dist < r * r && dist < bestDist) {
            bestDist = dist;
            bestGroup = group;
            bestMesh = mesh;
            bestColorKey = group.colorKeys ? group.colorKeys[mi] : group.colorKey;
          }
        }
      }
      return bestGroup ? { group: bestGroup, colorKey: bestColorKey, mesh: bestMesh } : null;
    }

    let ballColorKey = null;

    // ===== 动态速度与分数系统 =====
    let gameSpeedMultiplier = 1.0; // 用户在设置面板选择的倍速

    // 核心算法：全局速度随着分数增加而不断增加（每 1 分提升 2%）
    function getScoreSpeedMultiplier() {
      return 1.0 + 0.2 * Math.log1p(score);
    }

    // 获取右键加速倍率（按住时 1.5x）
    function getRightClickMultiplier() {
      return isRightClickPressed ? 1.5 : 1.0;
    }

    // 更新 UI 右上角速度文本
    function updateSpeedDisplayUI() {
      const speedEl = document.getElementById('speedDisplay');
      if (speedEl) {
        const totalMult = getScoreSpeedMultiplier() * gameSpeedMultiplier * getRightClickMultiplier();
        const boostTag = isRightClickPressed ? ' ⚡' : '';
        speedEl.textContent = `速度 ${totalMult.toFixed(2)}x${boostTag}`;
      }
    }

    // ===== 数据存储（使用 localStorage，向下兼容 Cookie） =====
    function getCookie(name) {
      const target = name + '=';
      const parts = document.cookie.split(';');
      for (let c of parts) {
        c = c.trim();
        if (c.indexOf(target) === 0) return decodeURIComponent(c.substring(target.length));
      }
      return null;
    }

    function getBestScore() {
      try {
        const val = localStorage.getItem('infiniteTrack_bestScore');
        if (val !== null) return parseInt(val, 10) || 0;
      } catch (e) {}
      // 向下兼容：尝试读取原 Cookie 存储
      const cookieVal = getCookie('infiniteTrack_bestScore');
      if (cookieVal !== null) {
        const parsed = parseInt(cookieVal, 10) || 0;
        setBestScore(parsed);
        return parsed;
      }
      return 0;
    }

    function setBestScore(val) {
      try {
        localStorage.setItem('infiniteTrack_bestScore', val.toString());
      } catch (e) {}
    }

    const scoreValueEl     = document.getElementById('scoreValue');
    const bestScoreValueEl = document.getElementById('bestScoreValue');

    let bestScore = getBestScore();
    bestScoreValueEl.textContent = bestScore;

    function syncScoreColor() {
      const cKey = ballColorKey || 'blue';
      const hex = COLORS[cKey] ? COLORS[cKey].hex : 0x4488ff;
      scoreValueEl.style.color = '#' + hex.toString(16).padStart(6, '0');
    }

    function addScore(n = 1) {
      score += n;
      scoreValueEl.textContent = score;
      scoreValueEl.classList.remove('bump');
      void scoreValueEl.offsetWidth;
      scoreValueEl.classList.add('bump');

      if (score > bestScore) {
        bestScore = score;
        bestScoreValueEl.textContent = bestScore;
        setBestScore(bestScore);
      }
      updateSpeedDisplayUI();
    }

    function resetScore() {
      score = 0;
      scoreValueEl.textContent = score;
      scoreValueEl.classList.remove('bump');
      updateSpeedDisplayUI();
    }

    // ===== 完美着陆与连击视觉反馈 =====
    function showPerfectUI(combo) {
      const popup = document.createElement('div');
      popup.className = 'perfect-popup';
      popup.textContent = combo > 1 ? `PERFECT! x${combo}` : 'PERFECT!';
      document.body.appendChild(popup);
      setTimeout(() => {
        if (popup && popup.parentNode) popup.parentNode.removeChild(popup);
      }, 850);
    }

    // 爆彩粒子系统
    const perfectParticles = [];

    function triggerPerfectBurstParticles(x, y, colorKey) {
      if (!enableParticles) return;
      const particleGeo = new THREE.SphereGeometry(BALL_RADIUS * 0.08, 6, 6);
      const particleCount = 45;
      const rainbowColors = [0xff68fd, 0xffe528, 0x15befc, 0xff3366, 0x33ffaa, 0xffffff];

      for (let i = 0; i < particleCount; i++) {
        const colorHex = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];
        const pMat = new THREE.MeshStandardMaterial({
          color: colorHex,
          emissive: colorHex,
          emissiveIntensity: 0.8,
          roughness: 0.1,
          transparent: true,
          opacity: 1.0
        });
        const particle = new THREE.Mesh(particleGeo, pMat);
        particle.position.set(
          x + (Math.random() - 0.5) * 0.3,
          y + 0.1,
          (Math.random() - 0.5) * 0.3
        );
        scene.add(particle);

        const speed = 4 + Math.random() * 6;
        const angle = Math.random() * Math.PI * 2;
        const elevation = Math.random() * Math.PI * 0.4;

        perfectParticles.push({
          mesh: particle,
          mat: pMat,
          vel: new THREE.Vector3(
            Math.cos(angle) * Math.cos(elevation) * speed,
            Math.sin(elevation) * speed + 2,
            Math.sin(angle) * Math.cos(elevation) * speed
          ),
          life: 0.7 + Math.random() * 0.3,
          maxLife: 0.7 + Math.random() * 0.3
        });
      }
    }

    function updatePerfectParticles(dt) {
      for (let i = perfectParticles.length - 1; i >= 0; i--) {
        const p = perfectParticles[i];
        p.life -= dt;
        p.vel.y -= 8 * dt;
        p.mesh.position.addScaledVector(p.vel, dt);

        const ratio = Math.max(0, p.life / p.maxLife);
        p.mat.opacity = ratio;
        p.mesh.scale.setScalar(Math.max(0.01, ratio * 1.2));

        if (p.life <= 0) {
          scene.remove(p.mesh);
          p.mesh.geometry.dispose();
          p.mat.dispose();
          perfectParticles.splice(i, 1);
        }
      }
    }

    // ===== 碎裂系统与摄像机震动 =====
    const DEATH_DURATION = 1.0;
    let dying = false;
    let deathTimer = 0;
    const deathFragments = [];
    const deathParticles = [];

    // 摄像机震动参数
    let cameraShakeTimer = 0;
    const CAMERA_SHAKE_DURATION = 0.4;

    function triggerDeath(plateColorKey) {
      dying = true;
      deathTimer = 0;
      velZ = 0;

      // 触发摄像机快频震动
      cameraShakeTimer = CAMERA_SHAKE_DURATION;

      sphere.visible = false;
      wireMesh.visible = false;
      ring.visible = false;

      const fragGeo = new THREE.IcosahedronGeometry(BALL_RADIUS * 0.25, 1);
      const fragCount = 25;
      for (let i = 0; i < fragCount; i++) {
        const fragMat = new THREE.MeshStandardMaterial({
          color: sphereMat.color.clone(),
          metalness: 0.3, roughness: 0.2,
          emissive: sphereMat.emissive.clone(),
          transparent: true, opacity: 1.0
        });
        const frag = new THREE.Mesh(fragGeo, fragMat);
        frag.position.set(ballX, ballY, 0);
        scene.add(frag);
        const speed = 3 + Math.random() * 5;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        deathFragments.push({
          mesh: frag, mat: fragMat,
          vel: new THREE.Vector3(
            Math.sin(phi) * Math.cos(theta) * speed,
            Math.abs(Math.cos(phi)) * speed * 0.8 + 2,
            Math.sin(phi) * Math.sin(theta) * speed
          ),
          angularVel: new THREE.Vector3((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10)
        });
      }

      if (enableParticles) {
        const particleGeo = new THREE.SphereGeometry(BALL_RADIUS * 0.06, 4, 4);
        const particleCount = 80;
        for (let i = 0; i < particleCount; i++) {
          const pMat = new THREE.MeshBasicMaterial({
            color: [0xff68fd, 0xffe528, 0x15befc, 0xffffff][Math.floor(Math.random() * 4)],
            transparent: true, opacity: 1.0
          });
          const particle = new THREE.Mesh(particleGeo, pMat);
          particle.position.set(ballX, ballY, 0);
          scene.add(particle);
          const speed = 1.5 + Math.random() * 7;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI;
          deathParticles.push({
            mesh: particle, mat: pMat,
            vel: new THREE.Vector3(
              Math.sin(phi) * Math.cos(theta) * speed,
              Math.abs(Math.cos(phi)) * speed * 0.6 + 1,
              Math.sin(phi) * Math.sin(theta) * speed
            ),
            life: 0.6 + Math.random() * 0.4
          });
        }
      }

      setTimeout(() => {
        showGameOver('颜色不同，球碎了...');
      }, DEATH_DURATION * 1000);
    }

    function updateDeath(dt) {
      if (!dying) return;
      deathTimer += dt;

      for (const f of deathFragments) {
        f.vel.y -= 9.8 * dt;
        f.mesh.position.addScaledVector(f.vel, dt);
        f.mesh.rotation.x += f.angularVel.x * dt;
        f.mesh.rotation.y += f.angularVel.y * dt;
        f.mesh.rotation.z += f.angularVel.z * dt;
        const alpha = Math.max(0, 1 - deathTimer / DEATH_DURATION);
        f.mat.opacity = alpha;
      }

      for (const p of deathParticles) {
        p.vel.y -= 6 * dt;
        p.mesh.position.addScaledVector(p.vel, dt);
        const lifeRatio = Math.max(0, p.life - deathTimer / DEATH_DURATION);
        p.mat.opacity = lifeRatio;
        const scale = Math.max(0.01, lifeRatio);
        p.mesh.scale.setScalar(scale);
      }
    }

    function cleanupDeath() {
      for (const f of deathFragments) {
        scene.remove(f.mesh);
        f.mat.dispose();
      }
      deathFragments.length = 0;
      for (const p of deathParticles) {
        scene.remove(p.mesh);
        p.mat.dispose();
      }
      deathParticles.length = 0;
      for (const p of perfectParticles) {
        scene.remove(p.mesh);
        p.mesh.geometry.dispose();
        p.mat.dispose();
      }
      perfectParticles.length = 0;
    }

    let lastLandedGroupId = -1;

    function onLandUpdateVelZ(scoreToAdd = 1) {
      let landingIdx = -1;
      let landingZ = Infinity;
      for (let i = 0; i < groupZList.length; i++) {
        if (Math.abs(groupZList[i]) < landingZ) {
          landingZ = Math.abs(groupZList[i]);
          landingIdx = i;
        }
      }

      if (landingIdx >= 0) {
        const group = trackGroups[landingIdx];
        if (group.type === 1 && group.colorKey) {
          const cKey = group.colorKey;
          const rgb = COLORS[cKey].rgb;
          sphereMat.color.set(COLORS[cKey].hex);
          sphereMat.emissive.set(new THREE.Color(rgb[0]*0.3/255, rgb[1]*0.3/255, rgb[2]*0.3/255));
          ballColorKey = cKey;
        }
        syncScoreColor();
        if (group.id !== lastLandedGroupId) {
          addScore(scoreToAdd);
          lastLandedGroupId = group.id;
        }
      }
      let nearestAheadZ = -Infinity;
      for (const z of groupZList) {
        if (z < -0.5 && z > nearestAheadZ) {
          nearestAheadZ = z;
        }
      }
      if (nearestAheadZ > -Infinity) {
        velZ = Math.abs(nearestAheadZ) / BOUNCE_PERIOD;
      }
    }

    // ===== 着陆特效系统 =====
    const landEffects = [];
    const RIPPLE_DURATION = 1.0;
    const PRESS_DURATION = 0.5;

    const rippleVertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;
    const rippleFragmentShader = `
      uniform vec3 uColor;
      uniform float uProgress;
      varying vec2 vUv;
      void main() {
        vec2 centered = abs(vUv - 0.5) * 2.0;
        float boxDist = max(centered.x, centered.y);
        float innerFill = 1.0 - smoothstep(0.0, 0.08, boxDist);
        float outerFade = 1.0 - smoothstep(0.0, 0.6, boxDist);
        float masterFade = 1.0 - smoothstep(0.3, 1.0, uProgress);
        float alpha = (innerFill * 0.7 + outerFade * 0.3) * masterFade;
        float glow = exp(-boxDist * 3.0) * masterFade * 0.5;
        vec3 col = uColor * (1.0 + glow * 0.5);
        gl_FragColor = vec4(col, alpha + glow * 0.4);
      }
    `;

    let enableParticles = true;

    function triggerLandEffect(plateMesh, plateColorKey, plateGroup, plateW, plateD) {
      const baseY = GROUND_Y + PLATE_HEIGHT / 2;
      landEffects.push({
        mesh: plateMesh, baseY, timer: 0, duration: PRESS_DURATION, type: 'press'
      });

      if (!enableParticles) return;

      const rgb = COLORS[plateColorKey].rgb;
      const color = new THREE.Color(rgb[0]/255, rgb[1]/255, rgb[2]/255);

      const rippleGeo = new THREE.PlaneGeometry(plateW, plateD);
      const rippleMat = new THREE.ShaderMaterial({
        uniforms: { uColor: { value: color }, uProgress: { value: 0.0 } },
        vertexShader: rippleVertexShader, fragmentShader: rippleFragmentShader,
        transparent: true, side: THREE.DoubleSide, depthWrite: false
      });
      const ripple = new THREE.Mesh(rippleGeo, rippleMat);
      ripple.rotation.x = -Math.PI / 2;
      plateMesh.add(ripple);
      ripple.position.set(0, -PLATE_HEIGHT / 2 - 0.005, 0);
      landEffects.push({
        mesh: ripple, parentMesh: plateMesh, timer: 0, duration: RIPPLE_DURATION, type: 'ripple', mat: rippleMat
      });

      const edgeCount = 40;
      const posArr = new Float32Array(edgeCount * 3);
      const edgePositions = [];
      for (let i = 0; i < edgeCount; i++) {
        const edge = Math.floor(Math.random() * 4);
        const t = (Math.random() - 0.5);
        let x, z;
        switch(edge) {
          case 0: x = plateW/2 * t; z = plateD/2; break;
          case 1: x = plateW/2 * t; z = -plateD/2; break;
          case 2: x = plateW/2; z = plateD/2 * t; break;
          case 3: x = -plateW/2; z = plateD/2 * t; break;
        }
        posArr[i*3] = x; posArr[i*3+1] = 0; posArr[i*3+2] = z;
        const len = Math.sqrt(x*x + z*z) || 1;
        edgePositions.push({ x, z, dx: x/len, dz: z/len });
      }
      const particleGeo = new THREE.BufferGeometry();
      particleGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      const particleMat = new THREE.PointsMaterial({
        color: color, size: 0.06, transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending, depthWrite: false
      });
      const particles = new THREE.Points(particleGeo, particleMat);
      particles.rotation.x = -Math.PI / 2;
      plateMesh.add(particles);
      particles.position.set(0, -PLATE_HEIGHT / 2 - 0.005, 0);
      landEffects.push({
        mesh: particles, parentMesh: plateMesh, timer: 0, duration: RIPPLE_DURATION, type: 'particles', mat: particleMat, geo: particleGeo, edgePositions, origPositions: posArr.slice()
      });
    }

    function updateLandEffects(dt) {
      for (let i = landEffects.length - 1; i >= 0; i--) {
        const fx = landEffects[i];
        fx.timer += dt;
        const progress = Math.min(1, fx.timer / fx.duration);

        if (fx.type === 'press') {
          const t = progress;
          const pressDepth = 0.18;
          if (t < 0.5) {
            const ease = t * 2;
            fx.mesh.position.y = fx.baseY - pressDepth * ease;
          } else {
            const ease = (t - 0.5) * 2;
            const overshoot = Math.sin(ease * Math.PI) * 0.015;
            fx.mesh.position.y = fx.baseY - pressDepth * (1 - ease) + overshoot;
          }
        } else if (fx.type === 'ripple') {
          const scale = 1 + (1 - Math.pow(1 - progress, 2)) * 8;
          fx.mesh.scale.setScalar(scale);
          fx.mat.uniforms.uProgress.value = progress;
        } else if (fx.type === 'particles') {
          const posAttr = fx.geo.getAttribute('position');
          const eased = 1 - Math.pow(1 - progress, 2);
          for (let j = 0; j < fx.edgePositions.length; j++) {
            const ep = fx.edgePositions[j];
            const dist = eased * 1.5;
            posAttr.array[j*3]   = fx.origPositions[j*3]   + ep.dx * dist;
            posAttr.array[j*3+1] = Math.sin(progress * Math.PI) * 0.05;
            posAttr.array[j*3+2] = fx.origPositions[j*3+2] + ep.dz * dist;
          }
          posAttr.needsUpdate = true;
          fx.mat.opacity = (1 - progress) * 0.8;
        }

        if (fx.timer >= fx.duration) {
          if (fx.type === 'press') {
            fx.mesh.position.y = fx.baseY;
          } else {
            if (fx.parentMesh) fx.parentMesh.remove(fx.mesh);
            fx.mesh.geometry.dispose();
            if (fx.mat.dispose) fx.mat.dispose();
          }
          landEffects.splice(i, 1);
        }
      }
    }

    // GameOver 弹窗控制
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const gameOverMsgEl   = document.getElementById('gameOverMsg');
    const restartBtn = document.getElementById('restartBtn');

    function showGameOver(message) {
      if (message) gameOverMsgEl.textContent = message;
      gameOverOverlay.style.display = 'flex';
    }
    function hideGameOver() {
      gameOverOverlay.style.display = 'none';
    }

    restartBtn.addEventListener('click', () => {
      resetGame();
    });

    // ===== 暂停系统与切后台监听 =====
    const pauseOverlay = document.getElementById('pauseOverlay');
    const pauseKeyTip  = document.getElementById('pauseKeyTip');
    let isPaused = false;
    let wasPausedBeforeSettings = false; // 记录在打开设置面板前是否本就处于暂停状态
    let currentPauseKey = ' ';

    function updatePauseKeyTipUI() {
      pauseKeyTip.textContent = currentPauseKey === ' ' ? 'Space' : currentPauseKey.toUpperCase();
      document.getElementById('bindPauseBtn').textContent = currentPauseKey === ' ' ? 'SPACE' : currentPauseKey.toUpperCase();
    }

    function isGameOverVisible() {
      return gameOverOverlay.style.display === 'flex';
    }

    function setPaused(paused) {
      if (isGameOverVisible()) return;
      isPaused = paused;
      if (isPaused) {
        pauseOverlay.style.display = 'flex';
      } else {
        pauseOverlay.style.display = 'none';
        lastTime = performance.now() / 1000;
      }
    }

    function togglePause() {
      setPaused(!isPaused);
    }

    pauseOverlay.addEventListener('click', togglePause);

    // 页面切后台自动暂停
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && !isPaused && !isGameOverVisible()) {
        setPaused(true);
      }
    });

    // ===== 设置与弹窗逻辑 =====
    let isListeningKey = false;

    window.openSettings = function() {
      if (isGameOverVisible()) return;
      const settingsModal = document.getElementById('settingsModalOverlay');
      if (settingsModal.style.display === 'flex') return;

      // 记录打开设置前游戏是否原本就处于暂停状态
      wasPausedBeforeSettings = isPaused;

      if (!isPaused) {
        setPaused(true);
      } else {
        pauseOverlay.style.display = 'none';
      }
      settingsModal.style.display = 'flex';
    };

    window.closeSettings = function() {
      const settingsModal = document.getElementById('settingsModalOverlay');
      settingsModal.style.display = 'none';
      if (isListeningKey) cancelKeyListening();
      setPaused(false);
    };

    // 单击空白背景退出设置面板
    window.onSettingsOverlayClick = function(e) {
      if (e.target === document.getElementById('settingsModalOverlay')) {
        closeSettings();
      }
    };

    // 单击空白背景退出清除确认面板
    window.onClearOverlayClick = function(e) {
      if (e.target === document.getElementById('clearConfirmOverlay')) {
        closeClearConfirm();
      }
    };

    window.listenPauseKey = function() {
      isListeningKey = true;
      const btn = document.getElementById('bindPauseBtn');
      btn.textContent = '按下按键...';
      btn.classList.add('listening');
    };

    function cancelKeyListening() {
      isListeningKey = false;
      const btn = document.getElementById('bindPauseBtn');
      btn.classList.remove('listening');
      updatePauseKeyTipUI();
    }

    window.changeGameSpeed = function(val) {
      gameSpeedMultiplier = parseFloat(val) || 1.0;
      updateSpeedDisplayUI();
    };

    window.toggleEffects = function(checked) {
      enableParticles = checked;
    };

    // 导出/导入战绩
    window.exportSave = function() {
      const best = getBestScore();
      const dataStr = btoa(encodeURIComponent(JSON.stringify({ bestScore: best }) + '|||INF_TRACK_SECURE_V1'));
      const htmlTemplate = `<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>无限轨道 - 战绩证明</title>
<style>
body{background:#0a0a1a;color:#15befc;text-align:center;font-family:'Segoe UI',sans-serif;padding:50px;}
.card{background:rgba(20,10,40,0.85);border:1px solid #ff68fd;border-radius:15px;padding:40px;max-width:480px;margin:0 auto;box-shadow:0 0 30px rgba(255,104,253,0.3);}
h1{color:#ff4060;}
.stat{font-size:24px;margin:20px 0;}
</style></head>
<body>
<div class="card">
<h1>🏆 无限轨道战绩证明</h1>
<div class="stat">历史最高得分：<b style="color:#ffe528">${best} 分</b></div>
<p style="color:#aaa;">此文件可用于在其他设备上导入您的战绩。</p>
<div id="secure-save-data" style="display:none;">${dataStr}</div>
</div></body></html>`;

      const blob = new Blob([htmlTemplate], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `InfiniteTrack_BestScore_${best}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    window.handleImport = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const match = e.target.result.match(/<div id="secure-save-data" style="display:none;">(.*?)<\/div>/);
        if (match && match[1]) {
          try {
            const parts = decodeURIComponent(atob(match[1])).split('|||');
            if (parts[1] === 'INF_TRACK_SECURE_V1') {
              const parsed = JSON.parse(parts[0]);
              if (parsed.bestScore !== undefined) {
                bestScore = parseInt(parsed.bestScore, 10) || 0;
                bestScoreValueEl.textContent = bestScore;
                setBestScore(bestScore);
                alert(`成功导入最高分：${bestScore} 分！`);
              }
            } else { alert('存档验证失败！文件可能已被修改。'); }
          } catch { alert('存档解析失败！'); }
        } else { alert('无效的战绩证明文件！'); }
      };
      reader.readAsText(file);
      event.target.value = '';
    };

    // 清除最高分数据弹窗
    window.showClearConfirm = function() {
      document.getElementById('clearHintBest').textContent = bestScore;
      document.getElementById('clearConfirmInput').value = '';
      document.getElementById('clearConfirmOverlay').style.display = 'flex';
    };

    window.closeClearConfirm = function() {
      document.getElementById('clearConfirmOverlay').style.display = 'none';
    };

    window.confirmClearData = function() {
      const inputVal = parseInt(document.getElementById('clearConfirmInput').value, 10);
      if (inputVal === bestScore) {
        bestScore = 0;
        bestScoreValueEl.textContent = 0;
        setBestScore(0);
        closeClearConfirm();
        alert('最高分数据已成功清除！');
      } else {
        alert('输入的数值与当前最高分不符，取消删除！');
      }
    };

    // 全局 Keydown 事件
    document.addEventListener('keydown', (e) => {
      if (isListeningKey) {
        e.preventDefault();
        currentPauseKey = e.key === ' ' ? ' ' : e.key;
        cancelKeyListening();
        return;
      }

      if (e.key === 'Escape' || e.key === 'Esc') {
        e.preventDefault();
        if (document.getElementById('clearConfirmOverlay').style.display === 'flex') {
          closeClearConfirm();
          return;
        }
        const modal = document.getElementById('settingsModalOverlay');
        if (modal.style.display === 'flex') {
          closeSettings();
        } else {
          openSettings();
        }
        return;
      }

      if (e.key === currentPauseKey || (currentPauseKey === ' ' && e.code === 'Space')) {
        e.preventDefault();
        if (document.getElementById('settingsModalOverlay').style.display === 'flex') {
          closeSettings();
        } else {
          togglePause();
        }
      }
    });

    const FALL_RESET_Y = -30;
    let voidGameOverTriggered = false;

    function resetGame() {
      resetScore();
      while (trackGroups.length > 0) {
        removeGroup(0);
      }
      generateInitialGroups();
      ballX = 0;
      targetBallX = 0;
      ballY = floorContact;
      velY = Math.sqrt(2 * _g * INIT_HEIGHT);
      falling = false;
      dying = false;
      ballColorKey = null;
      comboCount = 0;

      // 重置右键加速状态
      isRightClickPressed = false;

      // 重置摄像机位置与震动
      cameraShakeTimer = 0;
      camera.position.set(0, 3, 10);

      if (trackGroups.length > 0 && trackGroups[0].type === 1 && trackGroups[0].colorKey) {
        const cKey = trackGroups[0].colorKey;
        const rgb = COLORS[cKey].rgb;
        sphereMat.color.set(COLORS[cKey].hex);
        sphereMat.emissive.set(new THREE.Color(rgb[0]*0.3/255, rgb[1]*0.3/255, rgb[2]*0.3/255));
        ballColorKey = cKey;
      } else {
        sphereMat.color.set(0x4488ff);
        sphereMat.emissive.set(0x112244);
        ballColorKey = null;
      }
      sphere.visible = true;
      wireMesh.visible = true;
      ring.visible = true;
      cleanupDeath();
      hideGameOver();
      isPaused = false;
      wasPausedBeforeSettings = false;
      pauseOverlay.style.display = 'none';
      lastTime = performance.now() / 1000;
      syncScoreColor();
      lastLandedGroupId = -1;
      voidGameOverTriggered = false;
      if (groupZList.length > 1) {
        velZ = Math.abs(groupZList[1]) / BOUNCE_PERIOD;
      } else {
        velZ = 2.0;
      }
    }

    if (groupZList.length > 1) {
      velZ = Math.abs(groupZList[1]) / BOUNCE_PERIOD;
    } else {
      velZ = 2.0;
    }
    if (trackGroups.length > 0 && trackGroups[0].type === 1 && trackGroups[0].colorKey) {
      const initColor = trackGroups[0].colorKey;
      const initRgb = COLORS[initColor].rgb;
      sphereMat.color.set(COLORS[initColor].hex);
      sphereMat.emissive.set(new THREE.Color(initRgb[0]*0.3/255, initRgb[1]*0.3/255, initRgb[2]*0.3/255));
      ballColorKey = initColor;
    }
    syncScoreColor();
    updateSpeedDisplayUI();

    let lastTime = performance.now() / 1000;
    let t = 0;

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now() / 1000;
      
      // 包含分数速度提升、基础倍速以及右键 1.25x 临时加速
      const totalSpeedMultiplier = getScoreSpeedMultiplier() * gameSpeedMultiplier * getRightClickMultiplier();
      
      let dt = (now - lastTime) * totalSpeedMultiplier;
      lastTime = now;
      dt = Math.min(dt, 0.05 * totalSpeedMultiplier);

      if (!isPaused) {
        t += dt;

        // X 轴移动平滑化（使用指数衰减插值）
        if (!dying && !voidGameOverTriggered && hasMouseInput) {
          const lerpFactor = 1 - Math.exp(-25 * dt);
          ballX += (targetBallX - ballX) * lerpFactor;
        }

        if (!dying && !voidGameOverTriggered) {
          velY += GRAVITY_Y * dt;
          ballY += velY * dt;
        }

        if (!falling && !dying) {
          if (ballY <= floorContact && velY < 0) {
            const hit = findCollisionWithAnyGroup();
            if (hit) {
              const { group, colorKey, mesh } = hit;
              if (group.type !== 1 && ballColorKey && colorKey && ballColorKey !== colorKey) {
                triggerDeath(colorKey);
              } else {
                ballY = floorContact;
                velY = Math.abs(velY);

                // 计算碰撞点是否位于方块/轨道的中心 30% 区域
                const pw = group.type === 1 ? LONG_SIZE_X : SQ_SIZE;
                const pd = group.type === 1 ? LONG_SIZE_Z : SQ_SIZE;
                const dx = Math.abs(ballX - mesh.position.x);
                const dz = Math.abs(0 - group.z);

                // 中心 30% 判定标准（左右及前后各占 15% 门槛）
                const isPerfect = (group.type !== 1) && (dx <= pw * 0.1) && (dz <= pd * 0.15);
                let scoreToAdd = 1;

                if (isPerfect) {
                  comboCount++;
                  scoreToAdd = 2; // PERFECT! 触发时加 2 分
                  showPerfectUI(comboCount);
                  triggerPerfectBurstParticles(ballX, ballY, colorKey);
                } else {
                  comboCount = 0; // 离心落地重置连击
                }

                onLandUpdateVelZ(scoreToAdd);

                if (hit.mesh && hit.colorKey) {
                  triggerLandEffect(hit.mesh, hit.colorKey, hit.group, pw, pd);
                }
              }
            } else {
              velY = -Math.abs(velY);
              falling = true;
              velZ = 0;
            }
          }
          if (velY <= 0 && (velY - GRAVITY_Y * dt) > 0) {
            if (ballY - floorContact < INIT_HEIGHT * 0.99) {
              ballY = floorContact + INIT_HEIGHT;
              velY  = 0;
            }
          }
        } else if (falling) {
          if (ballY < FALL_RESET_Y && !voidGameOverTriggered) {
            voidGameOverTriggered = true;
            velZ = 0;
            // 掉入虚空时叠加轻微的摄像机快频震动
            cameraShakeTimer = CAMERA_SHAKE_DURATION;
            showGameOver('掉入虚空了...');
          }
        } else if (dying) {
          updateDeath(dt);
        }

        // 摄像机震动计算与应用
        if (cameraShakeTimer > 0) {
          cameraShakeTimer -= dt;
          const factor = Math.max(0, cameraShakeTimer / CAMERA_SHAKE_DURATION);
          const shakeX = (Math.random() - 0.5) * 0.4 * factor;
          const shakeY = (Math.random() - 0.5) * 0.4 * factor;
          const shakeZ = (Math.random() - 0.5) * 0.4 * factor;
          camera.position.set(shakeX, 3 + shakeY, 10 + shakeZ);
        } else {
          camera.position.set(0, 3, 10);
        }

        updateTrack(velZ * dt, dt);

        if (!dying) {
          sphere.position.x   = ballX;
          sphere.position.y   = ballY;
          sphere.position.z   = 0;
          wireMesh.position.x = ballX;
          wireMesh.position.y = ballY;
          wireMesh.position.z = 0;
          ring.position.x     = ballX;
          ring.position.y     = ballY;
          ring.position.z     = 0;

          sphere.rotation.y += 0.25 * dt;
          sphere.rotation.x  = Math.sin(t * 0.4) * 0.1;
          wireMesh.rotation.y = sphere.rotation.y;
          wireMesh.rotation.x = sphere.rotation.x;

          ring.rotation.y += 0.35 * dt;
          ring.rotation.x  = Math.sin(t * 0.3) * 0.15;
        }

        movingLight.position.set(
          Math.cos(t * 0.7) * 2.8,
          ballY + Math.sin(t * 0.5) * 1.0,
          Math.sin(t * 0.7) * 2.8
        );
        lightBall.position.copy(movingLight.position);

        updateLandEffects(dt);
        updatePerfectParticles(dt);
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
